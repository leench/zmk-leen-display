# 将 LVGL 内存池从默认的 10000 增大到 16384 或更高
CONFIG_LV_Z_MEM_POOL_SIZE=32768

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_MIPI_DBI=y

# 延迟日志线程启动 8 秒（8000ms）
#CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

# 日志等级高一点，方便调试
CONFIG_LOG_DEFAULT_LEVEL=1

# 如果你只想看 ZMK 的日志
#CONFIG_ZMK_LOG_LEVEL_INF=y

CONFIG_LVGL=y
CONFIG_LV_USE_IMAGE=y

#CONFIG_LV_USE_LABEL=y

CONFIG_RAW_HID=y

#CONFIG_ROTATE_DISPLAY_180=n

CONFIG_ZMK_WPM=y

# ---- Custom Display Widgets ----
CONFIG_ZMK_WIDGET_CLOCK=y
CONFIG_ZMK_WIDGET_VOLUME=y
CONFIG_ZMK_WIDGET_BATTERY=y
CONFIG_ZMK_WIDGET_LAYER=y
CONFIG_ZMK_WIDGET_CONNECTION=y
CONFIG_ZMK_WIDGET_BONGO_CAT=y
CONFIG_ZMK_WIDGET_SYSICON=y
CONFIG_ZMK_WIDGET_MODIFIERS=y
# CONFIG_ZMK_WIDGET_WPM_STATUS=n

CONFIG_INPUT=y
CONFIG_INPUT_CST816D=y
CONFIG_INPUT_CST816D_INTERRUPT=y
# CONFIG_INPUT_CST816S=y
# CONFIG_INPUT_CST816S_INTERRUPT=y
CONFIG_ZMK_POINTING=y
